name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        # Pure-stdlib core/adapters tests run standalone; the archolith-adapter
        # test (needs archolith_proxy) skips cleanly when that repo is absent.
        run: pytest -q
